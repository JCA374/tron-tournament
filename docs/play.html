<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Play</title>
<link rel="stylesheet" href="style.css?v=f053e149">
</head>
<body>
<main>
<h1>Watch the models play</h1>
<p class="lede">Pick a model (newest first) and a game. Every model plays the same games, so you can compare them. A clip plays
once and stops on its result; press play to watch it again.</p>
<div class="picker" id="models"></div>
<p class="muted small" id="mnote"></p>
<div class="player" id="player"><video id="video" controls muted playsinline preload="metadata"></video></div>
<p id="caption"></p>
<div class="picker"><button id="next">Next game →</button></div>
<h2>Games</h2>
<div class="games" id="games"></div>
<h2>All models on this game</h2>
<div class="cmp" id="cmp"></div>
</main>
<script src="site.js?v=707a4ed6"></script>
<script src="common.js?v=448bd7f6"></script>
<script src="project.js?v=13964608"></script>
<script src="play.js?v=bdb3d051"></script>
</body>
</html>
